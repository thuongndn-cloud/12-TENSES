<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>12 Thì Tiếng Anh</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&family=Lora:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f3ec;--card:#fff;--ink:#1d2433;--muted:#5d6577;--line:#e4dfd3;--navy:#1b2b4b;--gold:#d6a84a;--bad:#c43d3d}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#121722;--card:#1a2130;--ink:#e8ebf2;--muted:#a3abbd;--line:#2e374b;--navy:#0e1626;--gold:#e3b95e;--bad:#ef7a7a}}
:root[data-theme="dark"]{--bg:#121722;--card:#1a2130;--ink:#e8ebf2;--muted:#a3abbd;--line:#2e374b;--navy:#0e1626;--gold:#e3b95e;--bad:#ef7a7a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,sans-serif}
.box{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.08)}
.top{background:linear-gradient(135deg,#1b2b4b,#2b406b);color:#fff;padding:22px}
.top small{letter-spacing:.25em;font-weight:700;font-size:.7rem;color:var(--gold)}
.top h1{font-family:Lora,serif;margin:.3em 0 0;font-size:1.5rem}
form{padding:22px}
label{font-weight:600;font-size:.9rem}
input[type=password]{width:100%;font:inherit;padding:11px 12px;margin:8px 0 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
input[type=password]:focus{outline:2px solid var(--gold)}
.rem{display:flex;gap:8px;align-items:center;font-size:.88rem;color:var(--muted)}
button{width:100%;margin-top:14px;border:0;border-radius:10px;padding:12px;font:inherit;font-weight:700;background:var(--gold);color:#1b1b1b;cursor:pointer}
button:disabled{opacity:.6}
.err{color:var(--bad);font-size:.88rem;min-height:1.3em;margin-top:8px}
p.note{color:var(--muted);font-size:.85rem;margin:0 0 14px}
</style>
</head>
<body>
<div class="box">
  <div class="top"><small>LỚP HỌC · TENSES</small><h1>🔒 12 Thì Tiếng Anh</h1></div>
  <form id="f">
    <p class="note">Trang dành riêng cho học sinh của lớp. Nhập mật khẩu giáo viên đã gửi để vào học.</p>
    <label for="pw">Mật khẩu</label>
    <input id="pw" type="password" autocomplete="current-password" required autofocus>
    <label class="rem"><input type="checkbox" id="rem" checked> Ghi nhớ trên máy này</label>
    <button id="go">Vào học →</button>
    <div class="err" id="err"></div>
  </form>
</div>

const ITER = 300000;
const KEY = 'tenses12_pw';
function b64(s){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
async function decrypt(pw){
  const raw = b64(DATA);                       // "Salted__" + 8-byte salt + ciphertext (OpenSSL format)
  const salt = raw.slice(8,16), ct = raw.slice(16);
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  const bits = new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:ITER,hash:'SHA-256'}, base, 384));
  const key = await crypto.subtle.importKey('raw', bits.slice(0,32), 'AES-CBC', false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-CBC',iv:bits.slice(32,48)}, key, ct);
  const html = new TextDecoder().decode(pt);
  if(!html.startsWith('<!--OK-->')) throw new Error('bad');
  return html;
}
async function unlock(pw, remember){
  const html = await decrypt(pw);
  try{ if(remember) localStorage.setItem(KEY,pw); else localStorage.removeItem(KEY); }catch(e){}
  document.open(); document.write(html); document.close();
}
document.getElementById('f').addEventListener('submit', async e=>{
  e.preventDefault();
  const btn = document.getElementById('go'), err = document.getElementById('err');
  btn.disabled = true; btn.textContent = 'Đang mở…'; err.textContent = '';
  try{ await unlock(document.getElementById('pw').value, document.getElementById('rem').checked); }
  catch(_){ err.textContent = 'Mật khẩu không đúng. Em kiểm tra lại nhé.'; btn.disabled = false; btn.textContent = 'Vào học →'; }
});
(async()=>{ let saved=null; try{saved=localStorage.getItem(KEY)}catch(e){}
  if(saved){ try{ await unlock(saved,true); }catch(_){ try{localStorage.removeItem(KEY)}catch(e){} } } })();
